<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photobooth Saya</title>

  <link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    text-align:center;
    width:320px;
}

button{
    margin-top:20px;
    padding:12px 20px;
    border:none;
    border-radius:12px;
    background:#ff4d6d;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#e63b5d;
}

#countdown{
    font-size:80px;
    font-weight:bold;
    color:#ff4d4d;
    height:90px;
    text-align:center;
}

</style>
</head>

<body>

<div class="container">

    <h1>📸 Photobooth</h1>

    <p>Abadikan momen terbaikmu.</p>

  <div id="countdown"></div>

    <video id="video" autoplay playsinline></video>

    <canvas id="canvas"></canvas>

  <img id="preview" alt="Hasil Foto">

    <div class="buttons">

        <button id="startCamera">
            📷 Buka Kamera
        </button>

        <button id="takePhoto">
            📸 Ambil Foto
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
